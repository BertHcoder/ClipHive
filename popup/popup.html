<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=380">
  <link rel="stylesheet" href="popup.css">
  <title>ClipHive</title>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-brand">
      <svg class="header-icon" viewBox="0 0 64 64" width="28" height="28">
        <!-- Honeycomb hexagon -->
        <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#F5A623" stroke="#3E2723" stroke-width="3"/>
        <!-- Bee body -->
        <ellipse cx="32" cy="32" rx="10" ry="13" fill="#FFD700" stroke="#3E2723" stroke-width="2"/>
        <!-- Bee stripes -->
        <line x1="22" y1="28" x2="42" y2="28" stroke="#3E2723" stroke-width="2"/>
        <line x1="22" y1="33" x2="42" y2="33" stroke="#3E2723" stroke-width="2"/>
        <line x1="23" y1="38" x2="41" y2="38" stroke="#3E2723" stroke-width="2"/>
        <!-- Wings -->
        <ellipse cx="24" cy="23" rx="6" ry="4" fill="rgba(255,255,255,0.6)" stroke="#3E2723" stroke-width="1"/>
        <ellipse cx="40" cy="23" rx="6" ry="4" fill="rgba(255,255,255,0.6)" stroke="#3E2723" stroke-width="1"/>
      </svg>
      <h1 class="header-title">ClipHive</h1>
    </div>
    <div class="header-right">
      <button class="btn-advanced" id="advancedBtn" title="Advanced features">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        Advanced
      </button>
      <span class="header-count" id="clipCount">0 clips</span>
    </div>
  </header>

  <!-- Search -->
  <div class="search-bar">
    <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#9E9E9E" stroke-width="2">
      <circle cx="11" cy="11" r="7"/>
      <line x1="16.5" y1="16.5" x2="21" y2="21"/>
    </svg>
    <input type="text" id="searchInput" class="search-input" placeholder="Search clips...">
  </div>

  <!-- Advanced Panel -->
  <div class="advanced-panel" id="advancedPanel" style="display: none;">
    <div class="advanced-tabs">
      <button class="advanced-tab active" data-tab="folders">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        </svg>
        Folders
      </button>
      <button class="advanced-tab" data-tab="templates">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
        Templates
      </button>
      <button class="advanced-tab" data-tab="exportimport">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Export/Import
      </button>
    </div>

    <!-- Folders Tab -->
    <div class="advanced-tab-content active" id="foldersTab">
      <div class="advanced-toolbar">
        <input type="text" id="newFolderInput" class="advanced-input" placeholder="New folder name...">
        <button class="btn-add" id="addFolderBtn" title="Create folder">+</button>
      </div>
      <div class="folder-list" id="folderList">
        <div class="empty-state-small" id="emptyFolders">No folders yet</div>
      </div>
    </div>

    <!-- Templates Tab -->
    <div class="advanced-tab-content" id="templatesTab">
      <div class="advanced-toolbar">
        <input type="text" id="newTemplateName" class="advanced-input" placeholder="Template name...">
        <button class="btn-add" id="addTemplateBtn" title="Create template">+</button>
      </div>
      <div id="templateEditor" style="display: none;">
        <textarea id="templateContent" class="template-textarea" placeholder="Template text..." rows="3"></textarea>
        <div class="template-editor-actions">
          <button class="btn-save-template" id="saveTemplateBtn">Save</button>
          <button class="btn-cancel-template" id="cancelTemplateBtn">Cancel</button>
        </div>
      </div>
      <div class="template-list" id="templateList">
        <div class="empty-state-small" id="emptyTemplates">No templates yet</div>
      </div>
    </div>

    <!-- Export/Import Tab -->
    <div class="advanced-tab-content" id="exportImportTab">
      <div class="export-import-section">
        <div class="export-group">
          <span class="export-label">Export clips</span>
          <div class="export-buttons">
            <button class="btn-export" id="exportJsonBtn">
              <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
              JSON
            </button>
            <button class="btn-export" id="exportCsvBtn">
              <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
              CSV
            </button>
          </div>
        </div>
        <div class="import-group">
          <span class="export-label">Import clips</span>
          <div class="import-area">
            <button class="btn-import" id="importJsonBtn">
              <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
              </svg>
              Import JSON
            </button>
            <input type="file" id="importFileInput" accept=".json" style="display:none">
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Clip List -->
  <main class="clip-list" id="clipList">
    <div class="empty-state" id="emptyState">
      <svg viewBox="0 0 64 64" width="48" height="48" class="empty-icon">
        <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="none" stroke="#E0C97F" stroke-width="2" stroke-dasharray="4"/>
      </svg>
      <p>No clips yet</p>
      <p class="empty-hint">Copy text on any page to start collecting</p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <button class="btn-pause" id="pauseBtn" title="Pause tracking">
      <svg class="pause-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="6" y="4" width="4" height="16"/>
        <rect x="14" y="4" width="4" height="16"/>
      </svg>
      <svg class="play-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
        <polygon points="5,3 19,12 5,21"/>
      </svg>
      <span class="pause-label">Pause</span>
    </button>
    <button class="btn-clear" id="clearAll">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
      </svg>
      Clear All
    </button>
  </footer>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
