name: Clipboard Regression Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  clipboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/clipboard.test.cjs